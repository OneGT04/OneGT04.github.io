<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>许德坚 · 产品设计作品集</title>
<meta name="description" content="许德坚的产品设计作品集，包含产品设计项目、界面设计与设计思考。">
<style>
  :root {
    --bg: #f6f5f3;
    --card: #ffffff;
    --ink: #1c1c1e;
    --muted: #8a8a8e;
    --line: #e5e3e0;
    --accent: #c8552e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  header {
    padding: 72px 0 40px;
    text-align: center;
  }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  h1 {
    font-size: clamp(34px, 6vw, 52px);
    font-weight: 600;
    letter-spacing: 6px;
    margin-bottom: 10px;
  }
  .subtitle {
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 2px;
  }
  .divider {
    width: 56px; height: 2px;
    background: var(--accent);
    margin: 28px auto 24px;
  }
  .intro {
    max-width: 520px;
    margin: 0 auto;
    font-size: 15px;
    color: #55555a;
  }

  main { padding-bottom: 40px; }
  .pages { display: grid; gap: 28px; }
  figure {
    background: var(--card);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
    cursor: zoom-in;
  }
  figure img {
    display: block;
    width: 100%;
    height: auto;
  }
  figcaption {
    padding: 10px 18px;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--muted);
    text-align: right;
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 28px 0 56px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { color: var(--accent); }

  /* 灯箱 */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(18,18,20,.94);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 94vw; max-height: 92vh;
    border-radius: 6px;
    cursor: default;
    box-shadow: 0 10px 60px rgba(0,0,0,.5);
  }
  .lb-btn {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 52px; height: 52px;
    border: none; border-radius: 50%;
    background: rgba(255,255,255,.1);
    color: #fff;
    font-size: 26px;
    cursor: pointer;
    transition: background .2s;
  }
  .lb-btn:hover { background: rgba(255,255,255,.25); }
  .lb-prev { left: 18px; }
  .lb-next { right: 18px; }
  .lb-close {
    position: absolute; top: 18px; right: 22px;
    border: none; background: none;
    color: #fff; font-size: 30px;
    cursor: pointer;
  }

  @media (max-width: 640px) {
    header { padding: 48px 0 28px; }
    .lb-btn { width: 42px; height: 42px; font-size: 20px; }
    .lb-prev { left: 8px; }
    .lb-next { right: 8px; }
  }
</style>
</head>
<body>

<header>

    <div class="eyebrow">Portfolio · 作品集</div>
    <h1>许德坚</h1>

  </div>
</header>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-close" id="lbClose" aria-label="关闭">&times;</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="上一页">&#8249;</button>
  <img id="lbImg" src="" alt="放大查看">
  <button class="lb-btn lb-next" id="lbNext" aria-label="下一页">&#8250;</button>
</div>

<script>
(function () {
  var figures = document.querySelectorAll('#gallery figure');
  var imgs = Array.prototype.map.call(figures, function (f) { return f.querySelector('img'); });
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var current = 0;

  function open(i) {
    current = (i + imgs.length) % imgs.length;
    lbImg.src = imgs[current].src;
    lbImg.alt = imgs[current].alt;
    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
  }
  function close() {
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
  }
  function step(d) { open(current + d); }

  imgs.forEach(function (img, i) {
    img.addEventListener('click', function () { open(i); });
  });
  document.getElementById('lbClose').addEventListener('click', function (e) { e.stopPropagation(); close(); });
  document.getElementById('lbPrev').addEventListener('click', function (e) { e.stopPropagation(); step(-1); });
  document.getElementById('lbNext').addEventListener('click', function (e) { e.stopPropagation(); step(1); });
  lb.addEventListener('click', close);
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
})();
</script>
